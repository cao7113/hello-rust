# https://taskfile.dev
version: "3"
tasks:
  default: cargo test
  run: cargo r --bin {{.CLI_ARGS}}
  another-bin: task run -- another-bin
  test: cargo test

  play: open https://play.rust-lang.org/
  hub: open https://crates.io
  # doc
  doc: rustup doc
  book: rustup doc --book
  mod: rustup doc --std

  ## bootstrap project
  # cargo init
  # cargo new bin-app
  # cargo new --lib lib-app
  mk-ferris: cargo new ferris
  # ./target/release/hello
  rel: cargo build --release
  # b = "build"
  # c = "check"
  # t = "test"
  # r = "run"
  # rr = "run --release"
  run-rel: cargo run --release {{.CLI_ARGS}}

  targets:
    desc: list all supported targets by rustc
    cmds:
      - rustc --print target-list
      # rustup target list
      #- rustup target add x86_64-unknown-linux-gnu

  ## Setup Rust

  # VsCode Extentions
  # rust-analyzer

  version:
    cmds:
      - |
        source $HOME/.cargo/env
        # Cargo: the Rust build tool and package manager
        cargo --version
        rustc --version
        rustdoc --version
        ls ~/.cargo/bin

  install:
    status:
      - cargo --version
    cmds:
      - task: rustup-install
      - task: version

  # https://www.rust-lang.org/tools/install
  rustup-install:  curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh

  # xcode-select --install
  # You will also need a linker, which is a program that Rust uses to join its compiled outputs into one file. It is likely you already have one. If you get linker errors, you should install a C compiler, which will typically include a linker. A C compiler is also useful because some common Rust packages depend on C code and will need a C compiler.
  # Ubuntu, you can install the build-essential package

  update:
    deps:
      - install
    cmds:
      # Rustup: the Rust installer and version management tool
      - rustup update
      # rustup update stable

  uninstall: rustup self uninstall

  brew-install: brew install rust
